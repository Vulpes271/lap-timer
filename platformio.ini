[platformio]
default_envs = esp32dev
core_dir = .platformio

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    mikalhart/TinyGPSPlus@1.1.0
    bodmer/TFT_eSPI@2.5.43
build_flags =
    -D USER_SETUP_LOADED=1
    -include include/tft_setup.h
